[project]
name = "llm-lab-api"
version = "0.1.0"
description = "Local-first LLM observability and interpretability API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
model = [
  "accelerate>=1.6,<2",
  "jlens @ https://github.com/anthropics/jacobian-lens/archive/581d398613e5602a5af361e1c34d3a92ea82ba8e.tar.gz",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=5.5,<6",
]
lens-fit = [
  "datasets>=4,<6",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/src/llm_lab"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["services/api/src"]
testpaths = ["services/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"services/api/tests/*" = ["S101"]
